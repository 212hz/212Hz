# main 브랜치에 push 될 때마다 초대장을 배포합니다.
#
# 배포 경로 2가지 (둘 다 매번 실행):
#  1) gh-pages 브랜치에 완성본을 올림  → Pages 설정 Source = "Deploy from a branch / gh-pages / (root)" 일 때 사용
#  2) Actions 방식(deploy-pages)       → Pages 설정 Source = "GitHub Actions" 일 때 사용
#     2026-11 에 이 저장소에서 (2)가 GitHub 서버 500 오류로 반복 실패하여 (1)을 기본 경로로 추가함.
name: Deploy invitation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 재배포도 가능

permissions:
  contents: write   # gh-pages 브랜치 push
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html css js assets _site/
          # 배포 버전 = 커밋 ID. CSS/JS 주소에 붙여 캐시를 무효화하고,
          # version.json 으로 열려 있는 초대장이 새 배포를 감지해 자동 새로고침하게 함
          VER="${GITHUB_SHA::7}"
          sed -i "s#css/style.css#css/style.css?v=${VER}#; s#js/main.js#js/main.js?v=${VER}#" _site/index.html
          sed -i "s#<meta name=\"build\" content=\"dev\" />#<meta name=\"build\" content=\"${VER}\" />#" _site/index.html
          echo "{\"build\":\"${VER}\"}" > _site/version.json
          grep -q "content=\"${VER}\"" _site/index.html || { echo "build meta 치환 실패"; exit 1; }
          touch _site/.nojekyll

      # (1) gh-pages 브랜치에 완성본 게시
      - name: Publish to gh-pages branch
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

      # (2) Actions 방식 — 실패해도 작업 전체를 실패시키지 않음
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        continue-on-error: true
